- name: Install Need Package
  community.general.apk:
    update_cache: false
    name:
      - python3
      - postgresql-dev
      - py3-virtualenv
      - py3-pip
      - gcc
      - musl-dev
      - python3-dev
      - linux-headers
    state: installed

- name: Add postgres user to key group
  ansible.builtin.user:
    name: postgres
    groups: key
    append: true

- name: Make Patroni folder
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "755"

- name: Make venv and install Patroni
  ansible.builtin.pip:
    name:
      - patroni[etcd3,psycopg2]
    virtualenv: /etc/patroni/venv/
    virtualenv_command: python3 -m venv ./venv

- name: Make system file
  ansible.builtin.template:
    src: patroni.j2
    dest: "/etc/init.d/patroni"
    mode: "755"

- name: Deploy certificate renewal hook
  ansible.builtin.template:
    src: certificate_hook.j2
    dest: /etc/certificate/renewal-hooks/deploy/patroni.sh
    mode: "755"

- name: Start Patroni
  ansible.builtin.service:
    name: patroni
    state: started
    enabled: true
