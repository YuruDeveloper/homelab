# valkey-sentinel 은 valkey-tools 에만 의존한다. valkey-server 를 함께 깔면
# Debian 은 설치 즉시 기본 설정으로 기동해 6379 를 선점하고, proxy2 의
# HAProxy 프런트엔드 bind 와 충돌한다.
- name: Install Need Package
  ansible.builtin.apt:
    name:
      - valkey-sentinel
      # valkey-cli 제공 — 인증서 갱신 훅의 CONFIG SET 재적재에 사용
      - valkey-tools
    state: present
    update_cache: true

- name: Add valkey user to key group
  ansible.builtin.user:
    name: valkey
    groups: key
    append: true

- name: Create Sentinel directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: valkey
    group: valkey
    mode: "0750"
  loop:
    - /var/lib/valkey
    - /var/log/valkey

- name: Deploy certificate renewal hook
  ansible.builtin.template:
    src: certificate_hook.j2
    dest: /etc/certificate/renewal-hooks/deploy/valkey.sh
    owner: root
    group: root
    mode: "0700"
  no_log: true

# Sentinel 은 이 파일을 런타임에 계속 재작성한다 — 현재 프라임, 발견한 동료,
# 레플리카가 모두 여기 기록된다. 즉 이 파일의 주인은 Sentinel 이다.
# 덮으면 페일오버 결과가 되감겨 진짜 프라임이 REPLICAOF 로 강등되므로,
# 존재 여부가 아니라 내용 마커로 판정한다 — 패키지가 기본 설정을 이미 깔아두기
# 때문에 force: false 는 영원히 스킵되어 평문 Sentinel 로 남는다.
# rc 0 = 우리 설정(스킵) / 1 = 패키지 기본값 / 2 = 파일 없음(둘 다 배포).
- name: Check whether Sentinel config is already ours
  ansible.builtin.command:
    argv:
      - grep
      - -q
      - "^sentinel monitor {{ sentinel_prime_name }} "
      - /etc/valkey/sentinel.conf
  register: sentinel_seeded
  changed_when: false
  failed_when: false

- name: Seed Sentinel config file (package default or blank only)
  ansible.builtin.template:
    src: sentinel.j2
    dest: /etc/valkey/sentinel.conf
    owner: valkey
    group: valkey
    mode: "0640"
    force: true
  no_log: true
  when: sentinel_seeded.rc != 0

- name: Enable and start Valkey Sentinel
  ansible.builtin.systemd:
    name: valkey-sentinel
    state: restarted
    enabled: true
    daemon_reload: true

