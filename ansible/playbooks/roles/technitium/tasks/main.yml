- name: Install Need Package
  community.general.apk:
    update_cache: false
    name:
      - aspnetcore10-runtime
      - icu
      - tar
      - openssl
    state: installed

- name: Make dns folder
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    mode: "755"
  loop:
    - "{{ dns_install_dir }}"
    - "{{ dns_install_dir }}/tmp"

- name: Install dns tar file
  ansible.builtin.get_url:
    url: "{{ dns_download_url }}"
    dest: "{{ dns_install_dir }}/tmp/DnsServerPortable.tar.gz"
    mode: "755"

- name: Untar dns tar file
  ansible.builtin.unarchive:
    src: "{{ dns_install_dir }}/tmp/DnsServerPortable.tar.gz"
    dest: "{{ dns_install_dir }}"
    remote_src: true

- name: Make service file
  ansible.builtin.template:
    src: dns.j2
    dest: "/etc/init.d/{{ dns_service_name }}"
    mode: "755"

- name: Remove temp folder
  ansible.builtin.file:
    path: "{{ dns_install_dir }}/tmp"
    state: absent

- name: Create PKCS#12 certificate for Technitium
  community.crypto.openssl_pkcs12:
    action: export
    path: "/etc/certificate/server/server.pfx"
    privatekey_path: "/etc/certificate/server/server.key"
    certificate_path: "/etc/certificate/server/server.crt"
    other_certificates: "/etc/certificate/server/chain.crt"
    friendly_name: "technitium"
    passphrase: ""
    mode: "0600"
    owner: root
    group: root

- name: Install Technitium certificate deploy hook
  ansible.builtin.template:
    src: hook.sh.j2
    dest: /etc/certificate/server/renewal-hooks/deploy/hook.sh
    owner: root
    group: root
    mode: "0755"

- name: Start Dns server
  ansible.builtin.service:
    name: "{{ dns_service_name }}"
    state: restarted
    enabled: true

- name: Remove temp Package
  community.general.apk:
    update_cache: false
    name:
      - tar
    state: removed
